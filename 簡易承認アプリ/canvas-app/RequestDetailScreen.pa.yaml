                                                  Set(varCurrentRequest, LookUp(T_Request, ID = varCurrentRequest.ID));
                                                  Set(varHistoryList, SortByColumns(Filter(T_RequestHistory, RequestID = varCurrentRequest.ID), "ActionDate", SortOrder.Descending, "ID", SortOrder.Descending));
                                                  Set(varHistCount, Min(CountRows(varHistoryList), 3));
                                                  Set(varHistRow1, If(varHistCount >= 1, Index(varHistoryList, varHistCount), Defaults(T_RequestHistory)));
                                                  Set(varHistRow2, If(varHistCount >= 2, Index(varHistoryList, varHistCount - 1), Defaults(T_RequestHistory)));
                                                  Set(varHistRow3, If(varHistCount >= 3, Index(varHistoryList, varHistCount - 2), Defaults(T_RequestHistory)));
