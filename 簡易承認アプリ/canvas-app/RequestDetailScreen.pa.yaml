Screens:
  RequestDetailScreen:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      LoadingSpinnerColor: =RGBA(79, 70, 229, 1)
      OnVisible: |-
        =Set(varCurrentRequest, LookUp(T_Request, ID = gblSelectedRequestID));
        Set(varAccessDenied, !IsApprover && varCurrentRequest.Applicant.Email <> User().Email);
        Set(varHistoryList, SortByColumns(Filter(T_RequestHistory, RequestID = gblSelectedRequestID), "ActionDate", SortOrder.Descending, "ID", SortOrder.Descending));
        Set(varHistCount, Min(CountRows(varHistoryList), 3));
        Set(varHistRow1, If(varHistCount >= 1, Index(varHistoryList, varHistCount), Defaults(T_RequestHistory)));
        Set(varHistRow2, If(varHistCount >= 2, Index(varHistoryList, varHistCount - 1), Defaults(T_RequestHistory)));
        Set(varHistRow3, If(varHistCount >= 3, Index(varHistoryList, varHistCount - 2), Defaults(T_RequestHistory)))
    Children:
      - AccessDeniedPanel:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            Fill: =RGBA(243, 244, 246, 1)
            Height: =Parent.Height
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutDirection: =LayoutDirection.Vertical
            LayoutGap: =16
            LayoutJustifyContent: =LayoutJustifyContent.Center
            Visible: =varAccessDenied
            Width: =Parent.Width
          Children:
            - AccessDeniedIcon:
                Control: ModernIcon
                Properties:
                  Height: =48
                  Icon: ="Alert"
                  IconColor: =RGBA(156, 163, 175, 1)
                  Width: =48
            - AccessDeniedText:
                Control: ModernText
                Properties:
                  Align: =Align.Center
                  Color: =RGBA(107, 114, 128, 1)
                  FontWeight: =FontWeight.Semibold
                  Height: =24
                  Size: =16
                  Text: ="この申請を閲覧する権限がありません。"
                  Width: =360
            - AccessDeniedBackButton:
                Control: Button
                Properties:
                  Appearance: ='ButtonCanvas.Appearance'.Primary
                  BasePaletteColor: =RGBA(79, 70, 229, 1)
                  BorderThickness: =0
                  FontColor: =RGBA(255, 255, 255, 1)
                  FontSize: =14
                  FontWeight: =FontWeight.Semibold
                  Height: =44
                  OnSelect: =Navigate(RequestListScreen, ScreenTransition.Fade)
                  Text: ="申請一覧に戻る"
                  Width: =160
