Screens:
  RequestListScreen:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      LoadingSpinnerColor: =RGBA(79, 70, 229, 1)
      OnVisible: |-
        =ClearCollect(
          colRequests,
          {Title: "出張申請(大阪営業所)", Applicant: "山田 太郎", RequestDate: "2024/06/01", UpdateDate: "2024/06/01", Status: "申請中"},
          {Title: "PC購入申請", Applicant: "山田 太郎", RequestDate: "2024/05/31", UpdateDate: "2024/06/01", Status: "承認"},
          {Title: "研修参加申請", Applicant: "鈴木 花子", RequestDate: "2024/05/30", UpdateDate: "2024/05/31", Status: "差戻し"},
          {Title: "備品購入申請", Applicant: "田中 一郎", RequestDate: "2024/05/28", UpdateDate: "2024/05/28", Status: "承認"},
          {Title: "ソフトウェア購入申請", Applicant: "山田 太郎", RequestDate: "2024/05/27", UpdateDate: "2024/05/27", Status: "未申請"},
          {Title: "出張申請(名古屋)", Applicant: "鈴木 花子", RequestDate: "2024/05/25", UpdateDate: "2024/05/25", Status: "申請中"}
        )
    Children:
      - grpRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - grpHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =0
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  Width: =Parent.Width
                  Height: =64
                  Fill: =RGBA(79, 70, 229, 1)
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - grpHeaderLeft:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        LayoutMinHeight: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                      Children:
                        - HeaderLogoIcon:
                            Control: ModernIcon
                            Properties:
                              FillPortions: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =28
                              Height: =28
                              Icon: ="DocumentBulletList"
                              IconColor: =RGBA(255, 255, 255, 1)
                        - HeaderAppTitle:
                            Control: ModernText
                            Properties:
                              PaddingTop: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              FillPortions: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =280
                              Height: =28
                              Text: ="簡易承認申請アプリ"
                              Color: =RGBA(255, 255, 255, 1)
                              Size: =17
                              FontWeight: =FontWeight.Semibold
                              VerticalAlign: =VerticalAlign.Middle
                  - grpHeaderRight:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        LayoutMinHeight: =0
                        AlignInContainer: =AlignInContainer.Stretch
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                      Children:
                        - grpUserText:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Center
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.End
                              Width: =120
                              Height: =40
                            Children:
                              - HeaderUserName:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    Width: =120
                                    Height: =20
                                    Text: ="山田 太郎"
                                    Color: =RGBA(255, 255, 255, 1)
                                    Size: =14
                                    FontWeight: =FontWeight.Semibold
                                    Align: =Align.Right
                              - HeaderUserRole:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    Width: =120
                                    Height: =18
                                    Text: ="一般ユーザー"
                                    Color: =RGBA(224, 222, 253, 1)
                                    Size: =12
                                    Align: =Align.Right
                        - grpAvatarWrap:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutMinHeight: =0
                              AlignInContainer: =AlignInContainer.Center
                              Width: =40
                              Height: =40
                            Children:
                              - HeaderAvatarBg:
                                  Control: Rectangle
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =40
                                    Height: =40
                                    Fill: =RGBA(255, 255, 255, 0.25)
                                    BorderThickness: =0
                              - HeaderAvatarIcon:
                                  Control: ModernIcon
                                  Properties:
                                    X: =10
                                    Y: =10
                                    Width: =20
                                    Height: =20
                                    Icon: ="Person"
                                    IconColor: =RGBA(255, 255, 255, 1)
            - grpMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =28
                  PaddingBottom: =32
                Children:
                  - PageTitle:
                      Control: ModernText
                      Properties:
                        PaddingTop: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        FillPortions: =0
                        LayoutMinHeight: =0
                        Width: =400
                        Height: =36
                        Text: ="申請一覧"
                        Color: =RGBA(17, 24, 39, 1)
                        Size: =26
                        FontWeight: =FontWeight.Bold
                  - grpFilterRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        LayoutMinHeight: =0
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =12
                        Width: =Parent.Width
                        Height: =44
                      Children:
                        - grpFilterInputs:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =1
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =12
                              Height: =44
                            Children:
                              - SearchInput:
                                  Control: ModernTextInput
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =406
                                    Height: =44
                                    Placeholder: ="タイトルで検索"
                                    Appearance: =Appearance.Outline
                                    Fill: =RGBA(255, 255, 255, 1)
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                              - StatusDropdown:
                                  Control: ModernDropdown
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =204
                                    Height: =44
                                    Default: |-
                                      ={Value: "すべてのステータス"}
                                    Items: |-
                                      =Table(
                                        {Value: "すべてのステータス"},
                                        {Value: "未申請"},
                                        {Value: "申請中"},
                                        {Value: "承認"},
                                        {Value: "差戻し"}
                                      )
                                    ItemDisplayText: ="Value"
                                    Appearance: =Appearance.Outline
                                    Fill: =RGBA(255, 255, 255, 1)
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                              - DateStartPicker:
                                  Control: ModernDatePicker
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =204
                                    Height: =44
                                    Placeholder: ="申請日(開始)"
                                    Appearance: =Appearance.Outline
                                    Fill: =RGBA(255, 255, 255, 1)
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                              - DateRangeSeparator:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    AlignInContainer: =AlignInContainer.Center
                                    Width: =16
                                    Height: =20
                                    Text: ="〜"
                                    Color: =RGBA(107, 114, 128, 1)
                                    Size: =14
                                    Align: =Align.Center
                              - DateEndPicker:
                                  Control: ModernDatePicker
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =204
                                    Height: =44
                                    Placeholder: ="申請日(終了)"
                                    Appearance: =Appearance.Outline
                                    Fill: =RGBA(255, 255, 255, 1)
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                        - NewRequestButton:
                            Control: Button
                            Properties:
                              FillPortions: =0
                              LayoutMinHeight: =0
                              Width: =160
                              Height: =44
                              Text: ="＋ 新規申請"
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(79, 70, 229, 1)
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontWeight: =FontWeight.Semibold
                              FontSize: =14
                              OnSelect: =Navigate(RequestFormScreen, ScreenTransition.Fade)
                              BorderThickness: =0
                  - grpListCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        FillPortions: =1
                        LayoutMinHeight: =0
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        Width: =Parent.Width
                        Fill: =RGBA(255, 255, 255, 1)
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        PaddingBottom: =16
                      Children:
                        - grpTableHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                              Width: =Parent.Width
                              Height: =24
                            Children:
                              - HeaderColTitle:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =370
                                    Height: =20
                                    Text: ="タイトル"
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(107, 114, 128, 1)
                              - HeaderColApplicant:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =230
                                    Height: =20
                                    Text: ="申請者"
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(107, 114, 128, 1)
                              - HeaderColRequestDate:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =185
                                    Height: =20
                                    Text: ="申請日"
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(107, 114, 128, 1)
                              - HeaderColStatus:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =185
                                    Height: =20
                                    Text: ="ステータス"
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(107, 114, 128, 1)
                              - HeaderColUpdateDate:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =185
                                    Height: =20
                                    Text: ="更新日"
                                    Size: =13
                                    FontWeight: =FontWeight.Semibold
                                    Color: =RGBA(107, 114, 128, 1)
                              - HeaderColChevron:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =59
                                    Height: =20
                                    Text: =""
                        - RequestGallery:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              FillPortions: =1
                              LayoutMinHeight: =0
                              Width: =Parent.Width
                              TemplateSize: =56
                              TemplatePadding: =0
                              ShowScrollbar: =false
                              Items: =colRequests
                            Children:
                              - grpRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                  Children:
                                    - RowTitle:
                                        Control: ModernText
                                        Properties:
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          Width: =HeaderColTitle.Width
                                          Height: =24
                                          Text: =ThisItem.Title
                                          Size: =14
                                          FontWeight: =FontWeight.Semibold
                                          Wrap: =false
                                          Color: =RGBA(17, 24, 39, 1)
                                    - grpRowApplicant:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutGap: =6
                                          Width: =HeaderColApplicant.Width
                                          Height: =24
                                        Children:
                                          - RowApplicantIcon:
                                              Control: ModernIcon
                                              Properties:
                                                FillPortions: =0
                                                LayoutMinHeight: =0
                                                AlignInContainer: =AlignInContainer.Center
                                                Width: =16
                                                Height: =16
                                                Icon: ="Person"
                                                IconColor: =RGBA(107, 114, 128, 1)
                                          - RowApplicantName:
                                              Control: ModernText
                                              Properties:
                                                PaddingTop: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                FillPortions: =0
                                                LayoutMinHeight: =0
                                                Width: =HeaderColApplicant.Width - 22
                                                Height: =24
                                                Text: =ThisItem.Applicant
                                                Size: =13
                                                Wrap: =false
                                                Color: =RGBA(55, 65, 81, 1)
                                    - RowRequestDate:
                                        Control: ModernText
                                        Properties:
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          Width: =HeaderColRequestDate.Width
                                          Height: =24
                                          Text: =ThisItem.RequestDate
                                          Size: =13
                                          Wrap: =false
                                          Color: =RGBA(55, 65, 81, 1)
                                    - RowStatusBadge:
                                        Control: Badge
                                        Properties:
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          Width: =HeaderColStatus.Width
                                          Height: =26
                                          Content: =ThisItem.Status
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          ThemeColor: =Switch(ThisItem.Status, "承認", 'BadgeCanvas.ThemeColor'.Success, "差戻し", 'BadgeCanvas.ThemeColor'.Danger, "申請中", 'BadgeCanvas.ThemeColor'.Warning, 'BadgeCanvas.ThemeColor'.Subtle)
                                    - RowUpdateDate:
                                        Control: ModernText
                                        Properties:
                                          PaddingTop: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          Width: =HeaderColUpdateDate.Width
                                          Height: =24
                                          Text: =ThisItem.UpdateDate
                                          Size: =13
                                          Wrap: =false
                                          Color: =RGBA(55, 65, 81, 1)
                                    - grpRowChevronWrap:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          Width: =HeaderColChevron.Width
                                          Height: =24
                                        Children:
                                          - RowChevron:
                                              Control: ModernIcon
                                              Properties:
                                                FillPortions: =0
                                                LayoutMinHeight: =0
                                                AlignInContainer: =AlignInContainer.Center
                                                Width: =18
                                                Height: =18
                                                Icon: ="ChevronRight"
                                                IconColor: =RGBA(156, 163, 175, 1)
                              - RowClickButton:
                                  Control: Button
                                  Properties:
                                    X: =0
                                    Y: =0
                                    Width: =Parent.TemplateWidth
                                    Height: =Parent.TemplateHeight
                                    Text: =""
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    OnSelect: =Navigate(RequestDetailScreen, ScreenTransition.Fade)
                        - grpFooterRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              LayoutMinHeight: =0
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutAlignItems: =LayoutAlignItems.Center
                              Width: =Parent.Width
                              Height: =32
                            Children:
                              - FooterCountLabel:
                                  Control: ModernText
                                  Properties:
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    Width: =260
                                    Height: =20
                                    Text: ="6件中 1 - 6件を表示"
                                    Size: =13
                                    Color: =RGBA(107, 114, 128, 1)
                              - grpPagination:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    LayoutMinHeight: =0
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Height: =32
                                  Children:
                                    - PagePrevButton:
                                        Control: Button
                                        Properties:
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          Width: =32
                                          Height: =32
                                          Text: ="<"
                                          Appearance: ='ButtonCanvas.Appearance'.Outline
                                          FontColor: =RGBA(55, 65, 81, 1)
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                    - PageCurrentButton:
                                        Control: Button
                                        Properties:
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          Width: =32
                                          Height: =32
                                          Text: ="1"
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(79, 70, 229, 1)
                                          FontColor: =RGBA(255, 255, 255, 1)
                                    - PageNextButton:
                                        Control: Button
                                        Properties:
                                          FillPortions: =0
                                          LayoutMinHeight: =0
                                          Width: =32
                                          Height: =32
                                          Text: =">"
                                          Appearance: ='ButtonCanvas.Appearance'.Outline
                                          FontColor: =RGBA(55, 65, 81, 1)
                                          BorderColor: =RGBA(229, 231, 235, 1)
