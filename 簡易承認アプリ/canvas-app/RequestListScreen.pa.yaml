Screens:
  RequestListScreen:
    Properties:
      Fill: =RGBA(243, 244, 246, 1)
      LoadingSpinnerColor: =RGBA(79, 70, 229, 1)
      OnVisible: =Refresh(T_Request)
    Children:
      - grpRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            DropShadow: =DropShadow.None
            Height: =Parent.Height
            LayoutDirection: =LayoutDirection.Vertical
            Width: =Parent.Width
          Children:
            - grpHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  Fill: =RGBA(79, 70, 229, 1)
                  FillPortions: =0
                  Height: =64
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                  LayoutMinHeight: =0
                  LayoutMinWidth: =0
                  PaddingLeft: =24
                  PaddingRight: =24
                  Width: =Parent.Width
                Children:
                  - grpHeaderLeft:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                      Children:
                        - HeaderLogoIcon:
                            Control: ModernIcon
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Height: =28
                              Icon: ="DocumentBulletList"
                              IconColor: =RGBA(255, 255, 255, 1)
                              LayoutMinHeight: =0
                              Width: =28
                        - HeaderAppTitle:
                            Control: ModernText
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              Color: =RGBA(255, 255, 255, 1)
                              FontWeight: =FontWeight.Semibold
                              Height: =28
                              LayoutMinHeight: =0
                              PaddingBottom: =0
                              PaddingLeft: =0
                              PaddingRight: =0
                              PaddingTop: =0
                              Size: =17
                              Text: ="簡易承認申請アプリ"
                              Width: =280
                  - grpHeaderRight:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                      Children:
                        - grpUserText:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutAlignItems: =LayoutAlignItems.End
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutMinHeight: =0
                              Width: =120
                            Children:
                              - HeaderUserName:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(255, 255, 255, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: =User().FullName
                                    Width: =120
                              - HeaderUserRole:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Right
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(224, 222, 253, 1)
                                    Height: =18
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =12
                                    Text: =CurrentUserRoleLabel
                                    Width: =120
                        - grpAvatarWrap:
                            Control: GroupContainer
                            Variant: ManualLayout
                            Properties:
                              AlignInContainer: =AlignInContainer.Center
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =40
                              LayoutMinHeight: =0
                              Width: =40
                            Children:
                              - HeaderAvatarBg:
                                  Control: Rectangle
                                  Properties:
                                    Fill: =RGBA(255, 255, 255, 0.25)
                                    Height: =40
                                    Width: =40
                              - HeaderAvatarIcon:
                                  Control: ModernIcon
                                  Properties:
                                    Height: =20
                                    Icon: ="Person"
                                    IconColor: =RGBA(255, 255, 255, 1)
                                    Width: =20
                                    X: =10
                                    Y: =10
            - grpMain:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  DropShadow: =DropShadow.None
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutGap: =20
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  PaddingBottom: =32
                  PaddingLeft: =32
                  PaddingRight: =32
                  PaddingTop: =28
                Children:
                  - PageTitle:
                      Control: ModernText
                      Properties:
                        Color: =RGBA(17, 24, 39, 1)
                        FontWeight: =FontWeight.Bold
                        Height: =36
                        LayoutMinHeight: =0
                        PaddingBottom: =0
                        PaddingLeft: =0
                        PaddingRight: =0
                        PaddingTop: =0
                        Size: =26
                        Text: ="申請一覧"
                        Width: =400
                  - grpFilterRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.None
                        FillPortions: =0
                        Height: =44
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutGap: =12
                        LayoutMinHeight: =0
                        Width: =Parent.Width
                      Children:
                        - grpFilterInputs:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              Height: =44
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =12
                              LayoutMinHeight: =0
                            Children:
                              - SearchInput:
                                  Control: ModernTextInput
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =44
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Placeholder: ="タイトルで検索"
                                    Width: =406
                              - StatusDropdown:
                                  Control: ComboBox
                                  Properties:
                                    Appearance: ='ComboboxCanvas.Appearance'.Outline
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                                    DefaultSelectedItems: |-
                                      =Table({Value: "すべてのステータス"})
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =44
                                    IsSearchable: =false
                                    Items: |-
                                      =Table(
                                        {Value: "すべてのステータス"},
                                        {Value: "未申請"},
                                        {Value: "申請中"},
                                        {Value: "承認"},
                                        {Value: "差戻し"}
                                      )
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Width: =204
                              - DateStartPicker:
                                  Control: ModernDatePicker
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =44
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Placeholder: ="申請日(開始)"
                                    Width: =204
                              - DateRangeSeparator:
                                  Control: ModernText
                                  Properties:
                                    Align: =Align.Center
                                    AlignInContainer: =AlignInContainer.Center
                                    Color: =RGBA(107, 114, 128, 1)
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =14
                                    Text: ="〜"
                                    Width: =16
                              - DateEndPicker:
                                  Control: ModernDatePicker
                                  Properties:
                                    Appearance: =Appearance.Outline
                                    BorderColor: =RGBA(209, 213, 219, 1)
                                    BorderThickness: =1
                                    Fill: =RGBA(255, 255, 255, 1)
                                    Height: =44
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Placeholder: ="申請日(終了)"
                                    Width: =204
                        - ReloadListButton:
                            Control: ModernIcon
                            Properties:
                              Height: =20
                              Icon: ="ArrowClockwise"
                              IconColor: =RGBA(107, 114, 128, 1)
                              OnSelect: =Refresh(T_Request)
                              Tooltip: ="最新の情報に更新"
                              Width: =20
                        - NewRequestButton:
                            Control: Button
                            Properties:
                              Appearance: ='ButtonCanvas.Appearance'.Primary
                              BasePaletteColor: =RGBA(79, 70, 229, 1)
                              BorderThickness: =0
                              FontColor: =RGBA(255, 255, 255, 1)
                              FontSize: =14
                              FontWeight: =FontWeight.Semibold
                              Height: =44
                              LayoutMinHeight: =0
                              OnSelect: =Set(gblSelectedRequestID, Blank()); Navigate(RequestFormScreen, ScreenTransition.Fade)
                              Text: ="＋ 新規申請"
                              Width: =160
                  - grpListCard:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        DropShadow: =DropShadow.Semilight
                        Fill: =RGBA(255, 255, 255, 1)
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutGap: =16
                        LayoutMinHeight: =0
                        PaddingBottom: =16
                        PaddingLeft: =24
                        PaddingRight: =24
                        PaddingTop: =24
                        Width: =Parent.Width
                      Children:
                        - grpTableHeader:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =24
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutGap: =8
                              LayoutMinHeight: =0
                              Width: =Parent.Width
                            Children:
                              - HeaderColTitle:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="タイトル"
                                    Width: =370
                              - HeaderColApplicant:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="申請者"
                                    Width: =230
                              - HeaderColRequestDate:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="申請日"
                                    Width: =185
                              - HeaderColStatus:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="ステータス"
                                    Width: =185
                              - HeaderColUpdateDate:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    FontWeight: =FontWeight.Semibold
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: ="更新日"
                                    Width: =185
                              - HeaderColChevron:
                                  Control: ModernText
                                  Properties:
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Text: =""
                                    Width: =59
                        - RequestGallery:
                            Control: Gallery
                            Variant: Vertical
                            Properties:
                              Items: |-
                                =Sort(
                                  Filter(
                                    T_Request,
                                    (IsApprover || Applicant.Email = User().Email) &&
                                    (IsBlank(SearchInput.Text) || SearchInput.Text in タイトル) &&
                                    (StatusDropdown.Selected.Value = "すべてのステータス" || Status.Value = StatusDropdown.Selected.Value) &&
                                    (IsBlank(DateStartPicker.SelectedDate) || RequestDate >= DateStartPicker.SelectedDate) &&
                                    (IsBlank(DateEndPicker.SelectedDate) || RequestDate <= DateEndPicker.SelectedDate)
                                  ),
                                  RequestDate,
                                  SortOrder.Descending
                                )
                              LayoutMinHeight: =0
                              ShowScrollbar: =false
                              TemplatePadding: =0
                              TemplateSize: =56
                              Width: =Parent.Width
                            Children:
                              - grpRow:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    Height: =Parent.TemplateHeight
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    Width: =Parent.TemplateWidth
                                  Children:
                                    - RowTitle:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(17, 24, 39, 1)
                                          FontWeight: =FontWeight.Semibold
                                          Height: =24
                                          LayoutMinHeight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =14
                                          Text: =ThisItem.タイトル
                                          Width: =HeaderColTitle.Width
                                          Wrap: =false
                                    - grpRowApplicant:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =24
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutGap: =6
                                          LayoutMinHeight: =0
                                          Width: =HeaderColApplicant.Width
                                        Children:
                                          - RowApplicantIcon:
                                              Control: ModernIcon
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Height: =16
                                                Icon: ="Person"
                                                IconColor: =RGBA(107, 114, 128, 1)
                                                LayoutMinHeight: =0
                                                Width: =16
                                          - RowApplicantName:
                                              Control: ModernText
                                              Properties:
                                                Color: =RGBA(55, 65, 81, 1)
                                                Height: =24
                                                LayoutMinHeight: =0
                                                PaddingBottom: =0
                                                PaddingLeft: =0
                                                PaddingRight: =0
                                                PaddingTop: =0
                                                Size: =13
                                                Text: =ThisItem.Applicant.DisplayName
                                                Width: =HeaderColApplicant.Width - 22
                                                Wrap: =false
                                    - RowRequestDate:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(55, 65, 81, 1)
                                          Height: =24
                                          LayoutMinHeight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =Text(ThisItem.RequestDate, "yyyy/mm/dd")
                                          Width: =HeaderColRequestDate.Width
                                          Wrap: =false
                                    - RowStatusBadge:
                                        Control: Badge
                                        Properties:
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          Content: =ThisItem.Status.Value
                                          Height: =26
                                          LayoutMinHeight: =0
                                          ThemeColor: =Switch(ThisItem.Status.Value, "承認", 'BadgeCanvas.ThemeColor'.Success, "差戻し", 'BadgeCanvas.ThemeColor'.Danger, "申請中", 'BadgeCanvas.ThemeColor'.Warning, 'BadgeCanvas.ThemeColor'.Subtle)
                                          Width: =HeaderColStatus.Width
                                    - RowUpdateDate:
                                        Control: ModernText
                                        Properties:
                                          Color: =RGBA(55, 65, 81, 1)
                                          Height: =24
                                          LayoutMinHeight: =0
                                          PaddingBottom: =0
                                          PaddingLeft: =0
                                          PaddingRight: =0
                                          PaddingTop: =0
                                          Size: =13
                                          Text: =Text(ThisItem.UpdateDate, "yyyy/mm/dd")
                                          Width: =HeaderColUpdateDate.Width
                                          Wrap: =false
                                    - grpRowChevronWrap:
                                        Control: GroupContainer
                                        Variant: AutoLayout
                                        Properties:
                                          DropShadow: =DropShadow.None
                                          FillPortions: =0
                                          Height: =24
                                          LayoutAlignItems: =LayoutAlignItems.Center
                                          LayoutDirection: =LayoutDirection.Horizontal
                                          LayoutMinHeight: =0
                                          Width: =HeaderColChevron.Width
                                        Children:
                                          - RowChevron:
                                              Control: ModernIcon
                                              Properties:
                                                AlignInContainer: =AlignInContainer.Center
                                                Height: =18
                                                Icon: ="ChevronRight"
                                                IconColor: =RGBA(156, 163, 175, 1)
                                                LayoutMinHeight: =0
                                                Width: =18
                              - RowClickButton:
                                  Control: Button
                                  Properties:
                                    Appearance: ='ButtonCanvas.Appearance'.Transparent
                                    Height: =Parent.TemplateHeight
                                    OnSelect: =Set(gblSelectedRequestID, ThisItem.ID); Navigate(RequestDetailScreen, ScreenTransition.Fade)
                                    Text: =""
                                    Width: =Parent.TemplateWidth
                        - grpFooterRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              DropShadow: =DropShadow.None
                              FillPortions: =0
                              Height: =32
                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutJustifyContent: =LayoutJustifyContent.SpaceBetween
                              LayoutMinHeight: =0
                              Width: =Parent.Width
                            Children:
                              - FooterCountLabel:
                                  Control: ModernText
                                  Properties:
                                    Color: =RGBA(107, 114, 128, 1)
                                    Height: =20
                                    LayoutMinHeight: =0
                                    PaddingBottom: =0
                                    PaddingLeft: =0
                                    PaddingRight: =0
                                    PaddingTop: =0
                                    Size: =13
                                    Text: =CountRows(RequestGallery.AllItems) & "件中 1 - " & CountRows(RequestGallery.AllItems) & "件を表示"
                                    Width: =260
                              - grpPagination:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    DropShadow: =DropShadow.None
                                    FillPortions: =0
                                    Height: =32
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutGap: =8
                                    LayoutMinHeight: =0
                                  Children:
                                    - PagePrevButton:
                                        Control: Button
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Outline
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          FontColor: =RGBA(55, 65, 81, 1)
                                          LayoutMinHeight: =0
                                          Text: ="<"
                                          Width: =32
                                    - PageCurrentButton:
                                        Control: Button
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Primary
                                          BasePaletteColor: =RGBA(79, 70, 229, 1)
                                          FontColor: =RGBA(255, 255, 255, 1)
                                          LayoutMinHeight: =0
                                          Text: ="1"
                                          Width: =32
                                    - PageNextButton:
                                        Control: Button
                                        Properties:
                                          Appearance: ='ButtonCanvas.Appearance'.Outline
                                          BorderColor: =RGBA(229, 231, 235, 1)
                                          FontColor: =RGBA(55, 65, 81, 1)
                                          LayoutMinHeight: =0
                                          Text: =">"
                                          Width: =32
